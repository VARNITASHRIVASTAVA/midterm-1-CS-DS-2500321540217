
<!DOCTYPE html>
<html>
<head>
    <title>Library Management System</title>
    <link rel="stylesheet" href="mt1.css">
</head>

<body>

    <h1>Library Management System</h1>

    <div class="container">

        <h2>Manage Books</h2>

        <label>Book ID</label>
        <select id="bookId">
            <option value="">Select Book ID</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
        </select>

        <label>Book Name</label>
        <select id="title">
            <option value="">Select Book</option>
            <option>The Alchemist</option>
            <option>Wings of Fire</option>
            <option>Rich Dad Poor Dad</option>
            <option>Harry Potter</option>
            <option>Atomic Habits</option>
        </select>

        <label>Author</label>
        <select id="author">
            <option value="">Select Author</option>
            <option>Paulo Coelho</option>
            <option>APJ Abdul Kalam</option>
            <option>Robert Kiyosaki</option>
            <option>J.K. Rowling</option>
            <option>James Clear</option>
        </select>

        <label>Category</label>
        <select id="category">
            <option value="">Select Category</option>
            <option>Fiction</option>
            <option>Biography</option>
            <option>Finance</option>
            <option>Fantasy</option>
            <option>Self Help</option>
        </select>

        <label>Publication Year</label>
        <input type="number" id="year" placeholder="Enter Year">

        <div class="buttons">
            <button onclick="addBook()">Add Book</button>
            <button onclick="updateBook()">Update Book</button>
            <button onclick="getBook()">Get Book By ID</button>
            <button onclick="getAllBooks()">Get All Books</button>
        </div>

        <p id="message"></p>

    </div>

    <div class="container">

        <h2>Available Books</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Book Name</th>
                    <th>Author</th>
                    <th>Category</th>
                    <th>Year</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="bookList"></tbody>
        </table>

    </div>

    <script src="mt1.js"></script>

</body>
</html>
